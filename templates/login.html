<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Officer Login | Biometric Voting Academic Project</title>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="login-page">

<!-- BACKGROUND DECORATION -->
<div class="login-background">
    <div class="shape shape-1"></div>
    <div class="shape shape-2"></div>
</div>

<!-- LOGIN CONTAINER -->
<div class="login-wrapper">
    <div class="login-container">
        
        <!-- HEADER -->
        <div class="login-header">
            <div class="login-logo">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/55/Emblem_of_India.svg" alt="India Emblem">
            </div>
            <h1>Biometric Voting Academic Project</h1>
            <p class="login-subtitle">Biometric Voting Verification System</p>
        </div>

        <!-- TITLE -->
        <h2 class="login-title">Election Officer Login</h2>

        <!-- ERROR MESSAGE -->
        {% if error %}
            <div class="login-error">
                <span>⚠️ {{ error }}</span>
            </div>
        {% endif %}

        <!-- FORM -->
        <form method="POST" class="login-form">
            
            <!-- USERNAME -->
            <div class="form-group">
                <label for="username">Username</label>
                <div class="input-wrapper">
                    <span class="input-icon">👤</span>
                    <input type="text" id="username" name="username" placeholder="Enter your username" required>
                </div>
            </div>

            <!-- PASSWORD -->
            <div class="form-group">
                <label for="password">Password</label>
                <div class="input-wrapper">
                    <span class="input-icon">🔐</span>
                    <input type="password" id="password" name="password" placeholder="Enter your password" required>
                </div>
            </div>

            <!-- REMEMBER ME -->
            <!-- <div class="remember-me">
                <input type="checkbox" id="remember" name="remember">
                <label for="remember">Remember me</label>
            </div> -->

            <!-- LOGIN BUTTON -->
            <button type="submit" class="btn-login" onclick="showLoadingEffect(event)">Login</button>

        </form>

        <!-- LOADING SPINNER -->
        <div id="loadingSpinner" class="loading-spinner" style="display: none;">
            <div class="spinner"></div>
            <p>Authenticating...</p>
        </div>

        <!-- FOOTER -->
        <div class="login-footer">
            <p>© 2026 Academic Project | Biometric Voting System</p>
        </div>

    </div>
</div>

<!-- SCRIPT -->
<script>
function showLoadingEffect(event) {
    event.preventDefault();

    const username = document.getElementById("username").value.trim();
    const password = document.getElementById("password").value.trim();

    // 🔴 Validation check
    if (username === "" || password === "") {
        alert("⚠️ Please fill both Username and Password");
        return; // stop execution
    }

    const loadingSpinner = document.getElementById('loadingSpinner');
    const loginForm = document.querySelector('.login-form');
    const loginContainer = document.querySelector('.login-container');

    // Show loading spinner
    loadingSpinner.style.display = 'flex';
    loginForm.style.opacity = '0.5';
    loginForm.style.pointerEvents = 'none';

    // Wait then submit
    setTimeout(() => {
        loginContainer.style.animation = 'fadeOut 0.6s ease-out forwards';

        setTimeout(() => {
            loginForm.submit();   // ✅ safe submit
        }, 600);
    }, 1500);
}
</script>
